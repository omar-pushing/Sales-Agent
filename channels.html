<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channels · VOOM Sales</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .head { display: flex; align-items: flex-end; gap: var(--s4); flex-wrap: wrap; }
  .head h1 { font-size: 22px; }
  .head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; max-width: 640px; }
  .head .tools { margin-inline-start: auto; display: flex; gap: var(--s2); flex-wrap: wrap; }

  .alert.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  .alert.warn .a-ico { color: var(--warn); }

  .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s4); }
  .sum { padding: var(--s3) var(--s4); display: flex; align-items: center; gap: var(--s3); }
  .sum .s-ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-ink); flex-shrink: 0; }
  .sum .s-l { font-size: 12.5px; color: var(--muted); }
  .sum .s-v { font-size: 20px; font-weight: 600; line-height: 1.2; }

  .sec-h { display: flex; align-items: center; gap: var(--s3); }
  .sec-h h2 { font-size: 16px; }
  .sec-h .sub { color: var(--muted); font-size: 12.5px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--s4); }
  .chc { display: flex; flex-direction: column; }
  .chc.off { background: var(--surface-2); }
  .chc.off .chc-top .t-name, .chc.off .stats { opacity: .6; }
  .chc.down { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  .chc-top { display: flex; align-items: flex-start; gap: var(--s3); padding: var(--s4) var(--s4) var(--s3); }
  .chc-top .t-name { font-weight: 600; font-size: 14.5px; }
  .chc-top .t-id { font-size: 12.5px; color: var(--muted); }
  .chc-top .switch { margin-inline-start: auto; }
  .chc-mid { padding: 0 var(--s4) var(--s3); display: flex; flex-direction: column; gap: 10px; }
  .kv2 { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; align-items: center; }
  .kv2 dt { color: var(--muted); } .kv2 dd { margin: 0; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--border); }
  .stats div { padding: 10px var(--s4); display: flex; flex-direction: column; }
  .stats div + div { border-inline-start: 1px solid var(--border); }
  .stats .v { font-weight: 600; font-size: 15px; }
  .stats .l { font-size: 11.5px; color: var(--muted); }
  .chc-foot { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-top: 1px solid var(--border); }
  .chc-foot .when { font-size: 12px; color: var(--muted); margin-inline-end: auto; display: inline-flex; align-items: center; gap: 4px; }

  .avail { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--s3); }
  .av { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border: 1.5px dashed var(--border-strong); border-radius: var(--r-lg); background: transparent; text-align: start; min-height: 64px; width: 100%; transition: border-color .15s, background .15s; }
  .av:hover { border-color: var(--brand); background: var(--surface); }
  .av .av-n { font-weight: 600; font-size: 13.5px; }
  .av .av-s { font-size: 12px; color: var(--muted); }
  .av .plus { margin-inline-start: auto; color: var(--brand-ink); }
  .ch-gmail { background: #c5221f; } .ch-outlook { background: #0f6cbd; }

  /* drawer */
  .drawer { width: min(580px, 100%); }
  .dh-name { font-size: 17px; font-weight: 600; }
  .steps { display: flex; gap: 0; padding: var(--s3) var(--s5); border-bottom: 1px solid var(--border); list-style: none; margin: 0; }
  .steps li { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .steps li + li::before { content: ""; flex: 0 0 16px; height: 1px; background: var(--border-strong); margin-inline-end: 8px; }
  .steps .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--border-strong); font-size: 12px; flex-shrink: 0; }
  .steps li[aria-current="step"] { color: var(--text); }
  .steps li[aria-current="step"] .n { border-color: var(--brand); background: var(--brand); color: var(--on-brand); }
  .steps li.done .n { border-color: var(--brand); color: var(--brand-ink); background: var(--brand-soft); }
  .pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
  .pick button { display: flex; align-items: center; gap: var(--s3); padding: var(--s3); border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); text-align: start; min-height: 56px; }
  .pick button[aria-pressed="true"] { border-color: var(--brand); box-shadow: var(--ring); }
  .pick .p-s { font-size: 11.5px; color: var(--muted); }
  .sec-t { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: var(--s2); }
  [lang="ar"] .sec-t { text-transform: none; letter-spacing: 0; font-size: 13px; }
  .req { color: var(--danger); margin-inline-start: 2px; }
  .secret-in { position: relative; }
  .secret-in .input { padding-inline-end: 44px; }
  .secret-in button { position: absolute; top: 0; inset-inline-end: 0; height: 40px; width: 40px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; border-radius: var(--r-sm); }
  .copy-field { display: flex; align-items: center; gap: var(--s2); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 4px 4px 4px 10px; }
  [dir="rtl"] .copy-field { padding: 4px 10px 4px 4px; }
  .copy-field code { flex: 1; min-width: 0; font-size: 12.5px; direction: ltr; unicode-bidi: isolate; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .test-res { display: none; align-items: center; gap: 8px; font-size: 13px; padding: 10px 12px; border-radius: var(--r-sm); }
  .test-res.ok { display: flex; background: var(--ok-soft); color: var(--ok); }
  .test-res.bad { display: flex; background: var(--danger-soft); color: var(--danger); }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .danger-zone { border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); border-radius: var(--r); padding: var(--s3) var(--s4); display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .danger-zone .grow div { font-size: 12.5px; color: var(--muted); }
  .drawer-f .back { margin-inline-end: auto; }

  @media (max-width: 1080px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .summary { grid-template-columns: minmax(0, 1fr); } .grid { grid-template-columns: minmax(0, 1fr); } .pick { grid-template-columns: minmax(0, 1fr); } .steps .lbl { display: none; } .kv2 { grid-template-columns: 96px minmax(0,1fr); } }
</style>
</head>

<div class="app">

  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">

      <section class="head">
        <div><h1 data-i18n="nav_channels"></h1><p class="sub" data-i18n="h_sub"></p></div>

        <span class="badge warn"><i data-lucide="triangle-alert"></i><span data-i18n="api_legend_gap"></span></span>
      </div>

      <section class="alert danger gap" id="downAlert" data-api="NEW GET /channels/health (proxy of SMAIA /api/v1/channels/health)"></section>

      <section class="summary gap" id="summary" data-api="NEW GET /analytics/channels?range=7d"></section>

      <section class="stack" style="gap:var(--s3)">
        <div class="sec-h"><h2 data-i18n="connected"></h2><span class="sub" id="connN"></span></div>
        <div class="grid" id="grid" data-api="GET /tenants/{tid}/channels/ {name, protocol, status, entry_stage_id, protocol_config}"></div>
      </section>

      <section class="stack" style="gap:var(--s3)">
        <div class="sec-h"><h2 data-i18n="available"></h2><span class="sub" data-i18n="available_s"></span></div>
        <div class="avail" id="avail"></div>
      </section>

    </main>
  </div>
</div>

function renderAlert() {
  const down = channels.filter((c) => c.status === 'active' && c.health === 'down');
  const el = document.getElementById('downAlert');

  el.innerHTML = `<div class="a-ico"><i data-lucide="plug-zap"></i></div>

}

function renderSummary() {
  const act = channels.filter((c) => c.status === 'active');
  const s = [['radio-tower', 's_conn', App.n(act.length)], ['messages-square', 's_msgs', App.compact(act.reduce((a, c) => a + c.msgs, 0))],
    ['timer', 's_first', dur(0.5)], ['user-plus', 's_leads', App.n(act.reduce((a, c) => a + c.leads, 0))]];
  document.getElementById('summary').innerHTML = s.map(([i, k, v]) => `<div class="card sum"><span class="s-ico"><i data-lucide="${i}"></i></span><div><div class="s-l">${App.t(k)}</div><div class="s-v num">${v}</div></div></div>`).join('');
  document.getElementById('connN').textContent = App.t('conn_n').replace('{a}', App.n(act.length)).replace('{d}', App.n(channels.length - act.length));
}

function renderGrid() {
  document.getElementById('grid').innerHTML = channels.map((c) => {
    const a = agent(c.agent), s = stage(c.entry), p = D.projects[c.project], off = c.status !== 'active', down = !off && c.health === 'down';
    const h = off ? `<span class="badge outline"><i data-lucide="circle-pause"></i>${App.t('h_off')}</span>` : down ? `<span class="badge danger"><i data-lucide="circle-x"></i>${App.t('h_down')}</span>` : `<span class="badge ok"><i data-lucide="circle-check"></i>${App.t('h_ok')}</span>`;
    return `<article class="card chc ${off ? 'off' : ''} ${down ? 'down' : ''}">
      <div class="chc-top">${badge(c.protocol)}
        <div style="min-width:0"><div class="t-name">${App.L(c.name)}</div><div class="t-id ltr">${App.esc(c.ident)}</div></div>
        <label class="switch" title="${App.t('f_status')}" data-api="PATCH /channels/{id} {status: active|disabled}"><input type="checkbox" data-toggle="${c.id}" ${off ? '' : 'checked'} aria-label="${App.t('enable').replace('{n}', App.esc(App.L(c.name)))}"><span class="track"></span></label>
      </div>
      <div class="chc-mid"><dl class="kv2">
        <dt>${App.t('k_health')}</dt><dd class="gap" data-api="NEW health">${h}</dd>
        <dt>${App.t('k_agent')}</dt><dd><i data-lucide="bot" class="ico-sm muted"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a ? App.L(a.name) : '—'}</span></dd>
        <dt>${App.t('k_entry')}</dt><dd>${s ? `<span class="badge info">${App.L(s.name)}</span>` : '—'}</dd>
        <dt>${App.t('k_proj')}</dt><dd>${App.L(p.name)} <span class="muted">· ${App.L(p.city)}</span></dd>
      </dl></div>
      <div class="stats gap" data-api="NEW per-channel analytics">
        <div><span class="v num">${App.compact(c.msgs)}</span><span class="l">${App.t('st_msgs')}</span></div>
        <div><span class="v num">${App.n(c.leads)}</span><span class="l">${App.t('st_leads')}</span></div>
        <div><span class="v num">${c.msgs ? dur(c.resp) : '—'}</span><span class="l">${App.t('st_resp')}</span></div>
      </div>
      <div class="chc-foot"><span class="when"><i data-lucide="clock" class="ico-sm"></i>${App.t('last_evt').replace('{t}', App.ago(c.mins))}</span>
        <button class="btn sm ghost" type="button" data-test="${c.id}"><i data-lucide="flask-conical" class="ico-sm"></i>${App.t('test')}</button>
        <button class="btn sm" type="button" data-edit="${c.id}"><i data-lucide="settings-2" class="ico-sm"></i>${App.t('configure')}</button></div>
    </article>`; }).join('');
  document.getElementById('avail').innerHTML = AVAIL.map((p) => `<button class="av" type="button" data-new="${p}">${badge(p)}
    <span style="min-width:0"><span class="av-n">${App.t('p_' + p)}</span><span class="av-s" style="display:block">${App.n(channels.filter((c) => c.protocol === p).length)} ${App.lang === 'ar' ? 'متصلة' : 'connected'}</span></span>
    <i class="plus" data-lucide="circle-plus"></i></button>`).join('');
}

function wire() {
  document.querySelectorAll('[data-toggle]').forEach((cb) => cb.onchange = () => {
    const c = channels.find((x) => x.id === cb.dataset.toggle); c.status = cb.checked ? 'active' : 'disabled';
    App.toast(App.t(cb.checked ? 'enabled_toast' : 'disabled_toast').replace('{n}', App.L(c.name))); draw();
  });
  document.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => openDrawer({ id: b.dataset.edit, step: +(b.dataset.step || 2) }));
  document.querySelectorAll('[data-new]').forEach((b) => b.onclick = () => openDrawer({ protocol: b.dataset.new, step: 2 }));
  document.querySelectorAll('[data-test]').forEach((b) => b.onclick = () => {
    const c = channels.find((x) => x.id === b.dataset.test);
    b.disabled = true; b.innerHTML = `<i data-lucide="loader-circle" class="ico-sm spin"></i>${App.t('testing')}`; App.icons();
    setTimeout(() => { App.toast(c.health === 'down' ? App.t('test_bad') : App.t('test_ok').replace('{p}', App.t('p_' + c.protocol))); draw(); }, 1100);
  });
}

/* ---------- connect / configure drawer ---------- */
const ds = { step: 1, protocol: 'whatsapp', id: null };
function openDrawer({ id = null, protocol, step = 1 }) {
  const c = id ? channels.find((x) => x.id === id) : null;
  Object.assign(ds, { id, step: c ? step : protocol ? 2 : 1, protocol: c ? c.protocol : protocol || 'whatsapp' });
  ds.draft = c ? { name: App.L(c.name), agent: c.agent, entry: c.entry, active: c.status === 'active', hours: true, cfg: {} }
               : { name: '', agent: D.agents.find((a) => a.channels.includes(ds.protocol))?.id || 'ag1', entry: 's1', active: true, hours: true, cfg: {} };
  drawDrawer();
  document.getElementById('scrim').classList.add('open'); document.getElementById('drawer').classList.add('open');
  document.getElementById('dClose').focus();
}

function credField([key, label, secret], c) {
  const id = 'cf_' + key, val = ds.draft.cfg[key] ?? (c ? (secret ? '••••••••••••' + (key.length * 713 % 9000 + 1000) : (key.includes('number') ? c.ident : key.includes('user') ? c.ident : 'demo_' + key)) : '');
  if (secret === 2) return `<div class="field"><label>${label}</label><button class="btn" type="button" style="justify-content:flex-start"><i data-lucide="log-in"></i>${App.lang === 'ar' ? 'تسجيل الدخول والسماح بالوصول' : 'Sign in and allow access'}</button><span class="help">${App.lang === 'ar' ? 'لا نخزّن كلمة المرور، فقط رمز الوصول.' : 'We never store the password, only the OAuth token.'}</span></div>`;
  return `<div class="field" id="w-${id}"><label for="${id}">${label}<span class="req" aria-hidden="true">*</span></label>
    ${secret ? `<div class="secret-in"><input class="input ltr" id="${id}" type="password" value="${App.esc(val)}" required aria-required="true" aria-describedby="e-${id}" autocomplete="off" data-key="${key}">
      <button type="button" data-reveal="${id}" aria-label="${App.t('reveal')}"><i data-lucide="eye" class="ico-sm"></i></button></div>`
      : `<input class="input ltr" id="${id}" value="${App.esc(val)}" required aria-required="true" aria-describedby="e-${id}" autocomplete="off" data-key="${key}">`}
    <span class="err" id="e-${id}" role="alert" style="display:none;font-size:12px;color:var(--danger);align-items:center;gap:4px"><i data-lucide="circle-alert" class="ico-sm"></i>${App.t('req_err')}</span></div>`;
}

function drawDrawer() {
  const c = ds.id ? channels.find((x) => x.id === ds.id) : null;
  const dr = document.getElementById('drawer');
  const stepLi = (n) => `<li class="${ds.step > n ? 'done' : ''}" ${ds.step === n ? 'aria-current="step"' : ''}><span class="n">${ds.step > n ? '<i data-lucide="check" style="width:13px;height:13px"></i>' : App.n(n)}</span><span class="lbl">${App.t('step' + n)}</span></li>`;
  let body = '';
  if (ds.step === 1) {
    body = `<section><div class="sec-t">${App.t('pick_h')}</div><div class="pick" role="group">${AVAIL.map((p) => `<button type="button" data-pick="${p}" aria-pressed="${ds.protocol === p}">${badge(p)}<span><span style="font-weight:600;font-size:13.5px;display:block">${App.t('p_' + p)}</span><span class="p-s">${CREDS[p].length} ${App.lang === 'ar' ? 'حقول' : 'fields'}</span></span></button>`).join('')}</div></section>`;
  } else if (ds.step === 2) {
    body = `<div class="field"><label for="fName">${App.t('f_name')}<span class="req" aria-hidden="true">*</span></label><input class="input" id="fName" value="${App.esc(ds.draft.name)}" aria-describedby="hName"><span class="help" id="hName">${App.t('f_name_help')}</span></div>
      <section data-api="channel.protocol_config {${CREDS[ds.protocol].map((x) => x[0]).join(', ')}}"><div class="sec-t">${App.t('cred_h')}</div><div class="stack">${CREDS[ds.protocol].map((f) => credField(f, c)).join('')}</div>
        <p class="help muted" style="font-size:12px;margin-top:8px;display:flex;gap:6px;align-items:center"><i data-lucide="lock" class="ico-sm"></i>${App.t('cred_help')}</p></section>
      <section data-api="POST /webhooks/{tenant_int}/{channel_int}?api_key="><div class="sec-t">${App.t('webhook_h')}</div>
        <div class="copy-field"><code>https://api.voom.cc/webhooks/12/${c ? 40 + +c.id.slice(2) : 'new'}?api_key=••••••••</code><button class="btn sm ghost" type="button" id="copyBtn"><i data-lucide="copy" class="ico-sm"></i>${App.t('copy')}</button></div>
        <span class="help" style="font-size:12px;color:var(--muted)">${App.t('webhook_help')}</span></section>
      <div class="stack" style="gap:8px"><button class="btn" type="button" id="testBtn" style="align-self:flex-start"><i data-lucide="flask-conical"></i>${App.t('test_conn')}</button>
        <div class="test-res" id="testRes" role="status"></div></div>`;
  } else {
    const agents = D.agents.filter((a) => a.channels.includes(ds.protocol));
    body = `<section><div class="sec-t">${App.t('route_h')}</div><div class="stack">
      <div class="field"><label for="fAgent">${App.t('f_agent')}</label><select class="select" id="fAgent">${(agents.length ? agents : D.agents).map((a) => `<option value="${a.id}" ${ds.draft.agent === a.id ? 'selected' : ''}>${App.L(a.name)} · ${a.service}</option>`).join('')}</select></div>
      <div class="field gap" data-api="channel.entry_stage_id (stored, unused by backend)"><label for="fEntry">${App.t('f_entry')}</label><select class="select" id="fEntry"><option value="">${App.t('none')}</option>${D.stages.map((s) => `<option value="${s.id}" ${ds.draft.entry === s.id ? 'selected' : ''}>${App.L(s.name)}</option>`).join('')}</select><span class="help">${App.t('f_entry_help')}</span></div>
      <div class="field"><label class="switch"><input type="checkbox" id="fActive" ${ds.draft.active ? 'checked' : ''}><span class="track"></span>${App.t('f_status')}</label><span class="help">${App.t('f_status_help')}</span></div>
      <div class="field gap" data-api="NEW channel.protocol_config.after_hours (convention)"><label class="switch"><input type="checkbox" id="fHours" ${ds.draft.hours ? 'checked' : ''}><span class="track"></span>${App.t('f_hours')}</label><span class="help">${App.t('f_hours_help')}</span></div>
    </div></section>
    ${c ? `<div class="danger-zone"><i data-lucide="unplug" style="color:var(--danger)"></i><div class="grow"><b>${App.t('dz_t')}</b><div>${App.t('dz_b')}</div></div><button class="btn danger" type="button" id="discBtn">${App.t('disconnect')}</button></div>` : ''}`;
  }
  dr.innerHTML = `
    <div class="drawer-h">${badge(ds.protocol)}<div class="grow" style="min-width:0"><div class="dh-name" id="dTitle">${c ? App.t('d_edit').replace('{n}', App.esc(App.L(c.name))) : App.t('d_new')}</div><div class="muted" style="font-size:12.5px">${App.t('p_' + ds.protocol)}</div></div>
      <button class="icon-btn" type="button" id="dClose" aria-label="${App.t('close')}"><i data-lucide="x"></i></button></div>
    <ol class="steps">${[1, 2, 3].map(stepLi).join('')}</ol>
    <div class="drawer-b">${body}</div>
    <div class="drawer-f">
      ${ds.step > 1 && !(c && ds.step === 2) ? `<button class="btn ghost back" type="button" id="dBack"><i class="flip-rtl" data-lucide="arrow-left"></i>${App.t('back')}</button>` : ''}
      <button class="btn" type="button" id="dCancel">${App.t('cancel')}</button>
      ${c ? `<button class="btn primary" type="button" id="dSave"><i data-lucide="check"></i>${App.t('save')}</button>` : ''}
      ${ds.step < 3 ? `<button class="btn ${c ? '' : 'primary'}" type="button" id="dNext">${App.t('next')}<i class="flip-rtl" data-lucide="arrow-right"></i></button>`
                    : c ? '' : `<button class="btn primary" type="button" id="dFinish"><i data-lucide="plug"></i>${App.t('finish')}</button>`}
    </div>`;
  App.icons();

  document.getElementById('dClose').onclick = closeDrawer;
  document.getElementById('dCancel').onclick = closeDrawer;
  dr.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => { ds.protocol = b.dataset.pick; drawDrawer(); dr.querySelector(`[data-pick="${ds.protocol}"]`).focus(); });
  dr.querySelectorAll('[data-reveal]').forEach((b) => b.onclick = () => { const i = document.getElementById(b.dataset.reveal); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.setAttribute('aria-label', App.t(show ? 'hide' : 'reveal')); b.innerHTML = `<i data-lucide="${show ? 'eye-off' : 'eye'}" class="ico-sm"></i>`; App.icons(); });
  dr.querySelectorAll('[data-key]').forEach((i) => i.onblur = () => { const bad = !i.value.trim(); document.getElementById('e-' + i.id).style.display = bad ? 'flex' : 'none'; i.setAttribute('aria-invalid', bad); i.style.borderColor = bad ? 'var(--danger)' : ''; });
  const cp = document.getElementById('copyBtn'); if (cp) cp.onclick = () => { App.toast(App.t('copied')); };
  const tb = document.getElementById('testBtn');
  if (tb) tb.onclick = () => {
    const res = document.getElementById('testRes'); tb.disabled = true; tb.innerHTML = `<i data-lucide="loader-circle" class="spin"></i>${App.t('testing')}`; res.className = 'test-res'; App.icons();
    setTimeout(() => {
      const bad = c && c.health === 'down' && !ds.draft.cfg.page_access_token;
      res.className = 'test-res ' + (bad ? 'bad' : 'ok');
      res.innerHTML = `<i data-lucide="${bad ? 'circle-x' : 'circle-check'}"></i><span>${bad ? App.t('test_bad') : App.t('test_ok').replace('{p}', App.t('p_' + ds.protocol))}</span>`;
      tb.disabled = false; tb.innerHTML = `<i data-lucide="flask-conical"></i>${App.t('test_conn')}`; App.icons();
    }, 1200);
  };
  dr.querySelectorAll('[data-key]').forEach((i) => i.addEventListener('input', () => { if (!i.value.includes('•')) ds.draft.cfg[i.dataset.key] = i.value; }));
  const keep = () => {
    const n = document.getElementById('fName'); if (n) ds.draft.name = n.value;
    const a = document.getElementById('fAgent'); if (a) { ds.draft.agent = a.value; ds.draft.entry = document.getElementById('fEntry').value; ds.draft.active = document.getElementById('fActive').checked; ds.draft.hours = document.getElementById('fHours').checked; }
  };
  const valid = () => {
    if (ds.step !== 2) return true;
    let first = null;
    dr.querySelectorAll('[data-key]').forEach((i) => { i.dispatchEvent(new Event('blur')); if (!i.value.trim() && !first) first = i; });
    const n = document.getElementById('fName'); if (!n.value.trim()) { n.style.borderColor = 'var(--danger)'; n.setAttribute('aria-invalid', 'true'); first = first || n; }
    if (first) first.focus(); return !first;
  };
  const bk = document.getElementById('dBack'); if (bk) bk.onclick = () => { keep(); ds.step--; drawDrawer(); };
  const nx = document.getElementById('dNext'); if (nx) nx.onclick = () => { keep(); if (!valid()) return; ds.step++; drawDrawer(); };
  const fin = document.getElementById('dFinish');
  if (fin) fin.onclick = () => {
    keep(); const nm = ds.draft.name || App.t('p_' + ds.protocol);
    channels.push({ id: 'ch' + (channels.length + 1), protocol: ds.protocol, name: N(nm, nm), ident: ds.draft.cfg.phone_number_id || ds.draft.cfg.bot_username || ds.draft.cfg.username || '—', status: ds.draft.active ? 'active' : 'disabled', health: 'ok', agent: ds.draft.agent, entry: ds.draft.entry, project: 'sadeel', msgs: 0, leads: 0, resp: 0, mins: 0 });
    App.toast(App.t('created').replace('{n}', nm)); closeDrawer(); draw();
  };
  const sv = document.getElementById('dSave');
  if (sv) sv.onclick = () => { keep(); if (!valid()) return; Object.assign(c, { name: ds.draft.name === App.L(c.name) ? c.name : N(ds.draft.name, ds.draft.name), agent: ds.draft.agent, entry: ds.draft.entry, status: ds.draft.active ? 'active' : 'disabled' }); if (ds.draft.cfg.page_access_token) c.health = 'ok'; App.toast(App.t('saved_t')); closeDrawer(); draw(); };
  const dc = document.getElementById('discBtn');
  if (dc) dc.onclick = () => { if (!confirm(App.t('disc_confirm').replace('{n}', App.L(c.name)))) return; channels = channels.filter((x) => x !== c); App.toast(App.t('disc_toast').replace('{n}', App.L(c.name))); closeDrawer(); draw(); };
}
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
document.getElementById('scrim').onclick = closeDrawer;
document.addEventListener('app:escape', closeDrawer);
document.getElementById('connectBtn').onclick = () => openDrawer({ step: 1 });

function draw() { renderAlert(); renderSummary(); renderGrid(); wire(); App.icons(); }
App.onRender(draw);
App.init('channels');
const q = new URLSearchParams(location.search).get('channel'); if (q) openDrawer({ id: q, step: 2 });
</script>
</body>
</html>
