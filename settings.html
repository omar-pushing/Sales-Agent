<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · VOOM Sales</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .set-grid { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: var(--s6); align-items: start; }
  .subnav { position: sticky; top: calc(var(--top-h) + var(--s5)); display: flex; flex-direction: column; gap: 2px; }
  .subnav a { display: flex; align-items: center; gap: var(--s3); min-height: 40px; padding: 0 var(--s3); border-radius: var(--r-sm); color: var(--text-2); font-weight: 500; font-size: 13.5px; }
  .subnav a:hover { background: var(--surface-2); text-decoration: none; color: var(--text); }
  .subnav a[aria-current="true"] { background: var(--brand-soft); color: var(--brand-ink); }
  .subnav a.dz { color: var(--danger); margin-top: var(--s3); border-top: 1px solid var(--border); border-radius: 0; padding-top: var(--s3); }
  .subnav a.dz[aria-current="true"] { background: var(--danger-soft); border-radius: var(--r-sm); }

  .panel { display: flex; flex-direction: column; gap: var(--s4); max-width: 880px; }
  .panel > header h2 { font-size: 20px; }
  .panel > header p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
  .form-grid .full { grid-column: 1 / -1; }
  .req { color: var(--danger); margin-inline-start: 2px; }
  .row-set { display: flex; align-items: flex-start; gap: var(--s4); padding: var(--s4) 0; border-bottom: 1px solid var(--border); }
  .row-set:first-child { padding-top: 0; } .row-set:last-child { border-bottom: 0; padding-bottom: 0; }
  .row-set .rs-t { font-weight: 500; }
  .row-set .rs-d { font-size: 12.5px; color: var(--muted); margin-top: 2px; max-width: 520px; }
  .row-set .rs-c { margin-inline-start: auto; flex-shrink: 0; display: flex; align-items: center; gap: var(--s2); }

  .logo-up { display: flex; align-items: center; gap: var(--s4); }
  .logo-box { width: 64px; height: 64px; border-radius: var(--r-lg); background: #d9b35b; color: #3b2a05; font-weight: 700; font-size: 22px; display: grid; place-items: center; }
  .preview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
  .preview div { background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; }
  .preview .pl { font-size: 11.5px; color: var(--muted); }
  .preview .pv { font-weight: 600; font-size: 14px; }

  .hours { display: flex; flex-direction: column; }
  .day { display: grid; grid-template-columns: 130px 56px minmax(0, 1fr); gap: var(--s3); align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .day:last-child { border-bottom: 0; }
  .day .times { display: flex; align-items: center; gap: var(--s2); }
  .day .times .input { width: 120px; height: 36px; }
  .day.off .times { opacity: .45; }
  .day .closed { font-size: 12.5px; color: var(--muted); }

  .checks { display: flex; flex-direction: column; gap: 10px; }
  .checks label { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; cursor: pointer; }
  .checks input { accent-color: var(--brand); width: 18px; height: 18px; margin-top: 2px; }
  .checks .c-d { font-size: 12px; color: var(--muted); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: var(--r-sm); height: 40px; }
  .stepper button { width: 40px; height: 38px; border: 0; background: transparent; color: var(--text-2); display: grid; place-items: center; }
  .stepper input { width: 48px; text-align: center; border: 0; background: transparent; height: 38px; font-weight: 600; outline: none; }

  .ntab { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .ntab th { font-size: 12px; color: var(--muted); font-weight: 500; text-align: center; padding: 0 0 10px; }
  .ntab th:first-child { text-align: start; }
  .ntab td { padding: 10px 0; border-top: 1px solid var(--border); }
  .ntab td.c { text-align: center; width: 96px; }
  .ntab .n-d { font-size: 12px; color: var(--muted); }

  .copy-field { display: flex; align-items: center; gap: var(--s2); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 4px; padding-inline-start: 10px; }
  .copy-field code { flex: 1; min-width: 0; font-size: 12.5px; direction: ltr; unicode-bidi: isolate; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .dz-card { border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
  .dz-card .card-h h3 { color: var(--danger); }
  .btn.danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }

  .savebar { position: fixed; bottom: 0; inset-inline-start: var(--side-w); inset-inline-end: 0; z-index: 45; display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s6);
    background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -8px 24px rgba(0,0,0,.08); transform: translateY(110%); transition: transform .22s var(--ease); }
  .savebar.show { transform: translateY(0); }
  .savebar .sb-t { display: flex; align-items: center; gap: 8px; font-weight: 500; margin-inline-end: auto; }
  .savebar .sb-t svg { color: var(--warn); }
  .content { padding-bottom: 96px; }

  .modal { position: fixed; inset: 0; display: none; place-items: center; z-index: 80; padding: var(--s4); }
  .modal.open { display: grid; }
  .modal .m-card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-3); width: min(460px, 100%); padding: var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
  .modal .m-ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--danger-soft); color: var(--danger); }
  .modal .m-acts { display: flex; justify-content: flex-end; gap: var(--s2); margin-top: var(--s2); }

  @media (max-width: 1080px) { .savebar { inset-inline-start: 0; padding: var(--s3) var(--s4); } }
  @media (max-width: 960px) {
    .set-grid { grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
    .subnav { position: static; flex-direction: row; overflow-x: auto; scrollbar-width: none; gap: 4px; border-bottom: 1px solid var(--border); padding-bottom: var(--s2); }
    .subnav a { white-space: nowrap; flex-shrink: 0; }
    .subnav a.dz { margin-top: 0; border-top: 0; padding-top: 0; }
  }
  @media (max-width: 720px) { .form-grid { grid-template-columns: minmax(0, 1fr); } .row-set { flex-wrap: wrap; } .row-set .rs-c { margin-inline-start: 0; } .preview { grid-template-columns: minmax(0, 1fr); } .day { grid-template-columns: 90px 50px minmax(0,1fr); } .day .times .input { width: 96px; } .savebar .sb-t span { display: none; } }
</style>
</head>
<body data-title="nav_settings" data-crumb="nav_config">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">
      <div class="api-legend row wrap" style="font-size:12px">
        <span class="badge info"><i data-lucide="plug"></i><span data-i18n="api_legend_ok"></span></span>
        <span class="badge warn"><i data-lucide="triangle-alert"></i><span data-i18n="api_legend_gap"></span></span>
      </div>
      <div class="set-grid">
        <nav class="subnav" id="subnav" aria-label="Settings sections"></nav>
        <div id="panel" class="panel"></div>
      </div>
    </main>
  </div>
</div>

<div class="savebar" id="savebar" role="region" aria-live="polite">
  <span class="sb-t"><i data-lucide="circle-dot"></i><span data-i18n="unsaved"></span></span>
  <button class="btn" type="button" id="discardBtn" data-i18n="discard"></button>
  <button class="btn primary" type="button" id="saveBtn"><i data-lucide="check"></i><span data-i18n="save"></span></button>
</div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cfT" aria-describedby="cfB">
  <div class="m-card">
    <div class="m-ico"><i data-lucide="triangle-alert"></i></div>
    <h3 id="cfT"></h3><p class="muted" id="cfB" style="font-size:13.5px"></p>
    <div class="field" id="cfField"><label for="cfIn" id="cfL"></label><input class="input ltr" id="cfIn" autocomplete="off"></div>
    <div class="m-acts"><button class="btn" type="button" id="cfNo"></button><button class="btn danger-solid" type="button" id="cfYes" disabled></button></div>
  </div>
</div>

function wire() {
  const p = document.getElementById('panel');
  p.querySelectorAll('[data-k]').forEach((el) => {
    const ev = el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, () => { S[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.dataset.k === 'fu' ? Math.max(0, Math.min(10, +el.value || 0)) : el.value; if (['digits', 'cal', 'cur'].includes(el.dataset.k)) document.getElementById('preview').outerHTML = preview(); syncBar(); });
  });
  const wn = document.getElementById('fWname');
  if (wn) wn.onblur = () => { const bad = !wn.value.trim(); document.getElementById('e-wname').style.display = bad ? 'block' : 'none'; wn.setAttribute('aria-invalid', bad); wn.style.borderColor = bad ? 'var(--danger)' : ''; };
  p.querySelectorAll('[data-day]').forEach((cb) => cb.onchange = () => { S.hours[cb.dataset.day][0] = cb.checked ? 1 : 0; renderPanel(); App.icons(); syncBar(); });
  p.querySelectorAll('[data-dt]').forEach((i) => i.oninput = () => { const [d, k] = i.dataset.dt.split(':'); S.hours[d][+k] = i.value; syncBar(); });
  p.querySelectorAll('[data-n]').forEach((cb) => cb.onchange = () => { const [k, i] = cb.dataset.n.split(':'); S.n[k][+i] = cb.checked ? 1 : 0; syncBar(); });
  p.querySelectorAll('[data-step]').forEach((b) => b.onclick = () => { S.fu = Math.max(0, Math.min(10, S.fu + +b.dataset.step)); document.getElementById('fuIn').value = S.fu; syncBar(); });
  p.querySelectorAll('[data-reveal]').forEach((b) => b.onclick = () => { const c = document.getElementById(b.dataset.reveal); const show = c.textContent === c.dataset.mask; c.textContent = show ? c.dataset.full : c.dataset.mask; b.textContent = App.t(show ? 'k_hide' : 'k_reveal'); });
  p.querySelectorAll('[data-copyk]').forEach((b) => b.onclick = () => { try { navigator.clipboard.writeText(document.getElementById(b.dataset.copyk).dataset.full); } catch (e) {} App.toast(App.t('copied')); });
  p.querySelectorAll('[data-rotate]').forEach((b) => b.onclick = () => { const c = document.getElementById(b.dataset.rotate); const tail = Math.random().toString(16).slice(2, 6); c.dataset.full = 'whk_live_' + Math.random().toString(16).slice(2, 18) + tail; c.dataset.mask = 'whk_live_••••••••••••••••' + tail; c.textContent = c.dataset.mask; App.toast(App.t('rotated')); });
  const ex = document.getElementById('expBtn'); if (ex) ex.onclick = () => App.toast(App.t('exp_toast'));
  const pz = document.getElementById('pauseBtn'); if (pz) pz.onclick = () => ask('cf_pause_t', 'cf_pause_b', 'cf_pause_y', null, () => App.toast(App.t('paused')));
  const dl = document.getElementById('delBtn'); if (dl) dl.onclick = () => ask('cf_del_t', 'cf_del_b', 'cf_del_y', saved.slug, () => App.toast(App.t('del_sched').replace('{d}', `${App.date(new Date(Date.now() + 30 * 864e5), { day: 'numeric', month: 'long', year: 'numeric' })} · ${App.hijri(new Date(Date.now() + 30 * 864e5))}`)));
}

function ask(t, b, y, typed, onYes) {
  const m = document.getElementById('confirm');
  document.getElementById('cfT').textContent = App.t(t); document.getElementById('cfB').textContent = App.t(b);
  document.getElementById('cfNo').textContent = App.t('cancel'); document.getElementById('cfYes').textContent = App.t(y);
  const f = document.getElementById('cfField'), inp = document.getElementById('cfIn'), yes = document.getElementById('cfYes');
  f.style.display = typed ? '' : 'none'; inp.value = ''; yes.disabled = !!typed;
  if (typed) { document.getElementById('cfL').textContent = App.t('cf_del_l').replace('{s}', typed); inp.oninput = () => { yes.disabled = inp.value.trim() !== typed; }; }
  document.getElementById('scrim').classList.add('open'); m.classList.add('open'); App.icons();
  (typed ? inp : document.getElementById('cfNo')).focus();
  const close = () => { m.classList.remove('open'); document.getElementById('scrim').classList.remove('open'); };
  document.getElementById('cfNo').onclick = close; yes.onclick = () => { close(); onYes(); };
  document.getElementById('scrim').onclick = close;
}
document.addEventListener('app:escape', () => { document.getElementById('confirm').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); });

function syncBar() { document.getElementById('savebar').classList.toggle('show', dirty()); }
document.getElementById('saveBtn').onclick = () => {
  if (!S.wname.trim()) { sec = 'workspace'; renderNav(); renderPanel(); App.icons(); const w = document.getElementById('fWname'); w.dispatchEvent(new Event('blur')); w.focus(); return; }
  saved = JSON.parse(JSON.stringify(S)); syncBar(); App.toast(App.t('saved'));
};
document.getElementById('discardBtn').onclick = () => { S = JSON.parse(JSON.stringify(saved)); renderPanel(); App.icons(); syncBar(); App.toast(App.t('discarded')); };
window.addEventListener('beforeunload', (e) => { if (dirty()) { e.preventDefault(); e.returnValue = App.t('leave_warn'); } });

App.onRender(() => { renderNav(); renderPanel(); syncBar(); });
App.init('settings');
</script>
</body>
